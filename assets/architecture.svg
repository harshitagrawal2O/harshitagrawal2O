<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The layers Harshit builds across: client, API, async and ML, data, infrastructure">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#30363D"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px; }
      .tech { font-size: 11.5px; fill: #8B949E; }
      .num  { font-size: 11px; fill: #484F58; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#0D1117" stroke="#21262D"/>
  <rect x="1" y="1" width="898" height="398" rx="13" fill="url(#grid)" opacity="0.4"/>

  <g class="mono">
    <!-- 01 CLIENT -->
    <text class="num" x="26" y="54">01</text>
    <rect x="70" y="18" width="810" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="26" width="3.5" height="44" rx="1.75" fill="#22D3EE"/>
    <text class="lbl" x="92" y="45" fill="#22D3EE">CLIENT</text>
    <text class="tech" x="92" y="64">Next.js &#183; React &#183; React Native (Expo) &#183; mobile-first, responsive</text>

    <path d="M468 82 l7 8 l7 -8" fill="none" stroke="#484F58" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 02 API -->
    <text class="num" x="26" y="130">02</text>
    <rect x="70" y="94" width="810" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="102" width="3.5" height="44" rx="1.75" fill="#6366F1"/>
    <text class="lbl" x="92" y="121" fill="#818CF8">API</text>
    <text class="tech" x="92" y="140">FastAPI &#183; Express &#183; REST &#183; auth &#183; request validation &#183; pagination</text>

    <path d="M468 158 l7 8 l7 -8" fill="none" stroke="#484F58" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 03 ASYNC + ML -->
    <text class="num" x="26" y="206">03</text>
    <rect x="70" y="170" width="395" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="178" width="3.5" height="44" rx="1.75" fill="#D29922"/>
    <text class="lbl" x="92" y="197" fill="#D29922">ASYNC</text>
    <text class="tech" x="92" y="216">Redis &#183; BullMQ workers &#183; retry-safe jobs</text>

    <rect x="485" y="170" width="395" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="485" y="178" width="3.5" height="44" rx="1.75" fill="#A371F7"/>
    <text class="lbl" x="507" y="197" fill="#A371F7">INFERENCE</text>
    <text class="tech" x="507" y="216">OpenCV &#183; scikit-learn &#183; LLMs + RAG</text>

    <path d="M468 234 l7 8 l7 -8" fill="none" stroke="#484F58" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 04 DATA -->
    <text class="num" x="26" y="282">04</text>
    <rect x="70" y="246" width="810" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="254" width="3.5" height="44" rx="1.75" fill="#3FB950"/>
    <text class="lbl" x="92" y="273" fill="#3FB950">DATA</text>
    <text class="tech" x="92" y="292">PostgreSQL &#183; Prisma &#183; SQLAlchemy &#183; Neon &#183; schema design</text>

    <path d="M468 310 l7 8 l7 -8" fill="none" stroke="#484F58" stroke-width="1.6" stroke-linecap="round"/>

    <!-- 05 INFRA -->
    <text class="num" x="26" y="358">05</text>
    <rect x="70" y="322" width="810" height="60" rx="10" fill="#161B22" stroke="#30363D"/>
    <rect x="70" y="330" width="3.5" height="44" rx="1.75" fill="#FF7B72"/>
    <text class="lbl" x="92" y="349" fill="#FF7B72">INFRA</text>
    <text class="tech" x="92" y="368">AWS EC2 / S3 / Lambda &#183; Docker &#183; CI/CD &#183; staged deploys</text>
  </g>
</svg>
