    <path d="M690 112 L760 32 M690 112 L760 62 M690 112 L760 92 M690 112 L760 122"/>
    <path d="M760 32 L832 64 M760 32 L832 96 M760 62 L832 64 M760 62 L832 96"/>
    <path d="M760 92 L832 64 M760 92 L832 96 M760 122 L832 64 M760 122 L832 96"/>
